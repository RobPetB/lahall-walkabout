<title>Lahäll Walkabout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed 3D view; controls float in the four corners like signage bolted to the scene. */
:root {
  --sky: #bfd8ea;
  --plate: #1b4f93;
  --plate-fg: #ffffff;
  --plate-edge: #ffffff;
  --panel: rgba(248, 250, 247, .9);
  --panel-fg: #1b2632;
  --muted: #536170;
  --line: rgba(27, 38, 50, .18);
  --accent: #1b4f93;
  --accent-fg: #ffffff;
  --font-sign: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --font-data: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #1a2340; --plate: #173f78; --plate-fg: #f3f6fb; --plate-edge: #dfe7f3;
    --panel: rgba(17, 23, 34, .86); --panel-fg: #e7edf3; --muted: #9babbb;
    --line: rgba(255, 255, 255, .17); --accent: #9cc3f4; --accent-fg: #0f1826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #1a2340; --plate: #173f78; --plate-fg: #f3f6fb; --plate-edge: #dfe7f3;
  --panel: rgba(17, 23, 34, .86); --panel-fg: #e7edf3; --muted: #9babbb;
  --line: rgba(255, 255, 255, .17); --accent: #9cc3f4; --accent-fg: #0f1826;
  color-scheme: dark;
}
/* The Day/Dusk button overrides the viewer theme for the scene, so the signage follows it. */
.app[data-sky="day"] {
  --sky: #bfd8ea; --plate: #1b4f93; --plate-fg: #ffffff; --plate-edge: #ffffff;
  --panel: rgba(248, 250, 247, .9); --panel-fg: #1b2632; --muted: #536170;
  --line: rgba(27, 38, 50, .18); --accent: #1b4f93; --accent-fg: #ffffff;
  color-scheme: light;
}
.app[data-sky="dusk"] {
  --sky: #1a2340; --plate: #173f78; --plate-fg: #f3f6fb; --plate-edge: #dfe7f3;
  --panel: rgba(17, 23, 34, .86); --panel-fg: #e7edf3; --muted: #9babbb;
  --line: rgba(255, 255, 255, .17); --accent: #9cc3f4; --accent-fg: #0f1826;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--sky); color: var(--panel-fg); font-family: var(--font-sign); overflow: hidden; }
.app { position: relative; height: 100%; min-height: 320px; background: var(--sky); color: var(--panel-fg); overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#view:active { cursor: grabbing; }
#view:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

.corner { position: absolute; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.corner > * { pointer-events: auto; }
.tl { top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); align-items: flex-start; max-width: min(60%, 420px); }
.tr { top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); align-items: flex-end; }
.bl { bottom: 12px; left: max(16px, env(safe-area-inset-left, 0px)); align-items: flex-start; max-width: calc(100% - 230px); }
.br { bottom: 12px; right: max(16px, env(safe-area-inset-right, 0px)); align-items: flex-end; }

/* Street-name plate, after the blue enamel signs on Swedish street corners */
.plate {
  background: var(--plate); color: var(--plate-fg);
  border: 2px solid var(--plate-edge); border-radius: 5px;
  box-shadow: 0 0 0 2px var(--plate), 0 6px 18px rgba(0, 0, 0, .25);
  padding: 5px 14px 3px; margin: 2px;
  min-width: 0; max-width: 100%;
}
.plate small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.plate h1 { margin: 0; font-size: clamp(18px, 3.4vw, 26px); font-weight: 800; line-height: 1.15; letter-spacing: .01em; overflow-wrap: anywhere; }

.panel {
  background: var(--panel); color: var(--panel-fg);
  border: 1px solid var(--line); border-radius: 6px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.seg { display: flex; padding: 3px; gap: 2px; }
.seg button, .tool {
  font: 600 13px/1 var(--font-sign); color: var(--panel-fg);
  background: transparent; border: 0; border-radius: 4px;
  padding: 9px 12px 7px; cursor: pointer; min-height: 34px;
}
.seg button:hover, .tool:hover { background: var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:focus-visible, .tool:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; justify-content: flex-end; }
.tool { border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
select.tool { max-width: 190px; padding-right: 8px; }

.readout { font: 400 12px/1.5 var(--font-data); padding: 7px 10px 5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.readout b { font-weight: 600; }
.readout span { color: var(--muted); }
.keys { font-size: 12px; line-height: 1.5; padding: 7px 10px 5px; color: var(--muted); max-width: 360px; }
.keys kbd { font: 600 11px/1 var(--font-data); color: var(--panel-fg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px 1px; }
.credit { font-size: 10.5px; color: var(--muted); padding: 3px 7px 2px; }
.credit a { color: inherit; }

#map { display: block; width: 168px; height: 184px; border-radius: 5px; cursor: crosshair; }
.mapwrap { padding: 4px; }
.lift { display: none; gap: 6px; }
.lift button { width: 46px; height: 46px; font-size: 18px; }
.stick { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 2px solid var(--plate-edge); background: rgba(27, 79, 147, .25); pointer-events: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: var(--plate); border: 2px solid var(--plate-edge); }

.veil { position: absolute; inset: 0; display: grid; place-items: center; background: var(--sky); padding-inline: 16px; text-align: center; }
.veil p { font-size: 15px; max-width: 34ch; margin: 12px auto 0; color: var(--panel-fg); }

@media (pointer: coarse) {
  .keys { display: none; }
  .app[data-mode="fly"] .lift { display: flex; }
}
@media (max-width: 560px) {
  #map { width: 118px; height: 129px; }
  .seg button, .tool { padding: 9px 9px 7px; font-size: 12px; }
  select.tool { max-width: 130px; }
  .bl { max-width: calc(100% - 160px); }
  .keys { display: none; }
  .readout { font-size: 11px; white-space: normal; }
  .tl { max-width: calc(100% - 32px); top: 58px; }
  .tr { left: max(16px, env(safe-area-inset-left, 0px)); }
  .row { justify-content: flex-start; }
}
</style>

<div class="app" id="app" data-mode="tour">
  <canvas id="view" tabindex="0" aria-label="3D view of Lahäll. Use W A S D to move and drag to look around."></canvas>

  <div class="corner tl">
    <div class="plate" aria-live="polite">
      <small id="district">Täby · Lahäll</small>
      <h1 id="street">Lahäll</h1>
    </div>
  </div>

  <div class="corner tr">
    <div class="row">
      <div class="panel seg" role="group" aria-label="How to move">
        <button type="button" id="m-tour" aria-pressed="true">Tour</button>
        <button type="button" id="m-walk" aria-pressed="false">Walk</button>
        <button type="button" id="m-fly" aria-pressed="false">Fly</button>
      </div>
      <button type="button" class="tool" id="sky">Dusk</button>
      <select class="tool" id="goto" aria-label="Go to a place">
        <option value="">Go to…</option>
      </select>
    </div>
  </div>

  <div class="corner bl">
    <div class="panel keys" id="keys">
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · drag or click to look · <kbd>Shift</kbd> faster ·
      <kbd>E</kbd> <kbd>Q</kbd> up and down · <kbd>F</kbd> walk or fly · <kbd>T</kbd> tour
    </div>
    <div class="panel readout" id="readout">59.4240°N 18.0741°E</div>
    <div class="credit panel">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, via Overture Maps. Building heights are estimated.</div>
  </div>

  <div class="corner br">
    <div class="lift">
      <button type="button" class="tool" id="up" aria-label="Fly up">▲</button>
      <button type="button" class="tool" id="down" aria-label="Fly down">▼</button>
    </div>
    <div class="panel mapwrap"><canvas id="map" width="336" height="368" aria-label="Map of Lahäll. Click to jump there."></canvas></div>
  </div>

  <div class="stick" id="stick" hidden><i></i></div>

  <div class="veil" id="veil">
    <div>
      <div class="plate" style="display:inline-block"><small>Täby</small><h1>Lahäll</h1></div>
      <p id="veilmsg">Laying out streets, houses and the Roslagsbanan line…</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

var APT = ['#ddd0b9', '#c9b59c', '#b56b58', '#e6e1d6', '#cfc7b2', '#a9675a'].map(col);

    (me.mode === 'walk' ? 'on foot' : Math.round(me.y) + ' m up') + ' <span>·</span> ' + Math.round(me.speed * 3.6) + ' km/h';
